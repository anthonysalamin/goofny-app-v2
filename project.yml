name: Goofny
options:
  bundleIdPrefix: com.goofny
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Goofny:
    type: application
    platform: iOS
    sources: [Goofny]
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Goofny/Info.plist
      properties:
        CFBundleDisplayName: Goofny
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: Goofny needs access to your photos so you can pick an avatar for your pet.
        NSCameraUsageDescription: Goofny needs camera access so you can take a photo of your pet.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [goofny]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goofny.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Code signing for running on a physical device.
        # Find your Team ID: Xcode > Settings > Apple Accounts > Personal Team,
        # or after selecting the team once in Signing & Capabilities, check
        # Build Settings > DEVELOPMENT_TEAM. It looks like "AB12CD34EF".
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4828GZST49
